name: JetBrains release

# Publishes the JetBrains plugin to JetBrains Marketplace.
# Run it from the Actions tab, or push a tag named jetbrains-v<version> (for example jetbrains-v0.1.0).
# Needs the repository secrets described in docs/jetbrains-marketplace-publishing.md.

on:
  workflow_dispatch:
  push:
    tags: ['jetbrains-v*']

permissions:
  contents: write

concurrency:
  group: jetbrains-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: jetbrains-marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep '^version=' jetbrains/gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "jetbrains-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match jetbrains/gradle.properties version ${version}" >&2
            exit 1
          fi

      - name: Check the publishing secrets are set
        env:
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: |
          missing=0
          for name in CERTIFICATE_CHAIN PRIVATE_KEY PUBLISH_TOKEN; do
            if [ -z "${!name}" ]; then echo "Missing secret JETBRAINS_${name}" >&2; missing=1; fi
          done
          exit $missing

      - name: Test, verify compatibility, sign and publish
        working-directory: jetbrains
        env:
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: ./gradlew :core:test :plugin:verifyPlugin :plugin:publishPlugin --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: pair-flow-jetbrains-signed
          path: jetbrains/plugin/build/distributions/*.zip
          if-no-files-found: error

      - name: Attach the plugin to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" jetbrains/plugin/build/distributions/*.zip \
            --title "Pair Flow for JetBrains ${GITHUB_REF_NAME#jetbrains-v}" \
            --notes-file jetbrains/CHANGELOG.md --prerelease
