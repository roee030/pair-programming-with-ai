name: VS Code release

# Publishes the VS Code extension when a tag named v<version> is pushed (for example v0.4.1),
# and attaches the .vsix to a GitHub release. Needs the VSCE_PAT repository secret
# (see docs/marketplace-publishing.md). Without it, the .vsix is still built and attached.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vscode-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Test, build and package
        run: npm run package

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set, so the extension was not published. Upload the .vsix from the release by hand."
            exit 0
          fi
          npx vsce publish --packagePath pair-flow-*.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: pair-flow-vsix
          path: pair-flow-*.vsix
          if-no-files-found: error

      - name: Attach the .vsix to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' CHANGELOG.md > release-notes.md
          gh release create "${GITHUB_REF_NAME}" pair-flow-*.vsix --title "Pair Flow v${version}" --notes-file release-notes.md
