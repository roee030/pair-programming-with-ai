name: JetBrains plugin

on:
  push:
    branches: [main]
    paths: ['jetbrains/**', 'src/ui/**', 'media/**', 'scripts/build-jetbrains-ui.mjs', '.github/workflows/jetbrains.yml']
  pull_request:
    paths: ['jetbrains/**', 'src/ui/**', 'media/**', 'scripts/build-jetbrains-ui.mjs', '.github/workflows/jetbrains.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core and build plugin
        working-directory: jetbrains
        run: ./gradlew :core:test :plugin:buildPlugin --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: pair-flow-jetbrains
          path: jetbrains/plugin/build/distributions/*.zip
          if-no-files-found: error
